<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 640" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #f8fafc;
        --canvas-border: #e2e8f0;
        --title: #0f172a;
        --subtitle: #475569;
        
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --header-txt: #0284c7;
        
        --well-bg: #f1f5f9;
        --well-border: #e2e8f0;
        
        --pin-lbl: #0f172a;
        --pin-desc: #475569;
        --pin-num: #0284c7;
        
        --wire-active: #0284c7;
        --wire-gnd: #64748b;
        --resistor-color: #d97706;
        --resistor-txt: #b45309;
        
        --formula: #b45309;
        --calc-txt: #334155;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #0f172a;
          --canvas-border: #1e293b;
          --title: #f8fafc;
          --subtitle: #94a3b8;
          
          --card-bg: #1e293b;
          --card-border: #334155;
          --header-txt: #38bdf8;
          
          --well-bg: #0b1120;
          --well-border: #334155;
          
          --pin-lbl: #f8fafc;
          --pin-desc: #94a3b8;
          --pin-num: #38bdf8;
          
          --wire-active: #38bdf8;
          --wire-gnd: #64748b;
          --resistor-color: #f59e0b;
          --resistor-txt: #fcd34d;
          
          --formula: #fbbf24;
          --calc-txt: #cbd5e1;
        }
      }

      .canvas-bg { fill: var(--canvas-bg); stroke: var(--canvas-border); stroke-width: 1.5; }
      .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.5; rx: 12px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: var(--title); text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--subtitle); text-anchor: middle; }
      .header-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: var(--header-txt); }
      .pin-lbl { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; fill: var(--pin-lbl); }
      .pin-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: var(--pin-desc); }
      .pin-num { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 800; fill: var(--pin-num); }
      
      .wire-active { stroke: var(--wire-active); stroke-width: 3; fill: none; }
      .wire-gnd { stroke: var(--wire-gnd); stroke-width: 3; fill: none; }
      .formula { font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; font-weight: bold; fill: var(--formula); }
      .calc-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: var(--calc-txt); }
    </style>
  </defs>

  <rect width="1050" height="640" class="canvas-bg" rx="16" />

  <text x="525" y="38" class="title">SƠ ĐỒ ĐẤU NỐI MẠCH ĐIỀU KHIỂN LED QUA GPIO17 RASPBERRY PI 4</text>
  <text x="525" y="62" class="subtitle">Bản Đồ 40-Pin Header, Tính Toán Định Luật Ohm &amp; Cách Ly Bảo Vệ Cổng Ra Vi Xử Lý BCM2711</text>

  <!-- LEFT: 40-PIN HEADER DIAGRAM -->
  <g transform="translate(35, 85)">
    <rect width="360" height="520" class="card" />
    <text x="20" y="28" class="header-txt">1. RASPBERRY PI 4 40-PIN PINOUT</text>
    
    <!-- Pin 1 & Pin 2 -->
    <rect x="25" y="50" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="#ef4444" stroke-width="1.5" />
    <text x="35" y="66" class="pin-num" fill="#ef4444">Pin 01: 3.3V Power</text>
    <text x="35" y="78" class="pin-desc">DC Power (Max 50mA)</text>
    
    <rect x="190" y="50" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="#ef4444" stroke-width="1.5" />
    <text x="200" y="66" class="pin-num" fill="#ef4444">Pin 02: 5.0V Power</text>
    <text x="200" y="78" class="pin-desc">⚠️ NGUY HIỂM: Hỏng SoC!</text>

    <!-- Pin 3 & Pin 4 -->
    <rect x="25" y="90" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="35" y="106" class="pin-lbl">Pin 03: GPIO02 (SDA)</text>
    <text x="35" y="118" class="pin-desc">I2C1 Data line</text>
    
    <rect x="190" y="90" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="#ef4444" stroke-width="1.5" />
    <text x="200" y="106" class="pin-num" fill="#ef4444">Pin 04: 5.0V Power</text>
    <text x="200" y="118" class="pin-desc">⚠️ Tuyệt đối không chạm</text>

    <!-- Pin 5 & Pin 6 (Pin 6 is GND!) -->
    <rect x="25" y="130" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="35" y="146" class="pin-lbl">Pin 05: GPIO03 (SCL)</text>
    <text x="35" y="158" class="pin-desc">I2C1 Clock line</text>
    
    <rect x="190" y="130" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="#64748b" stroke-width="2" />
    <text x="200" y="146" class="pin-num" fill="#64748b">Pin 06: GROUND (GND)</text>
    <text x="200" y="158" class="pin-desc" font-weight="bold">★ Nối vào Cathode LED (-)</text>

    <!-- Pin 7 & Pin 8 -->
    <rect x="25" y="170" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="35" y="186" class="pin-lbl">Pin 07: GPIO04 (GPCLK)</text>
    
    <rect x="190" y="170" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="200" y="186" class="pin-lbl">Pin 08: GPIO14 (TXD)</text>

    <!-- Pin 9 & Pin 10 -->
    <rect x="25" y="210" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="#64748b" stroke-width="1" />
    <text x="35" y="226" class="pin-num" fill="#64748b">Pin 09: GROUND</text>
    
    <rect x="190" y="210" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="200" y="226" class="pin-lbl">Pin 10: GPIO15 (RXD)</text>

    <!-- Pin 11 (GPIO17 - TARGET!) & Pin 12 -->
    <rect x="25" y="250" width="145" height="42" rx="6" fill="var(--well-bg)" stroke="#0284c7" stroke-width="2.5" />
    <text x="35" y="268" class="pin-num" fill="#0284c7">Pin 11: BCM GPIO17</text>
    <text x="35" y="282" class="pin-desc" font-weight="bold" fill="#0284c7">★ CHÂN ĐIỀU KHIỂN LED</text>
    
    <rect x="190" y="250" width="145" height="32" rx="4" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="200" y="266" class="pin-lbl">Pin 12: GPIO18 (PWM0)</text>

    <!-- Dotted continuation -->
    <text x="170" y="325" fill="#64748b" font-size="14" text-anchor="middle">⋮ (Các chân từ Pin 13 đến Pin 40) ⋮</text>
    
    <rect x="25" y="360" width="310" height="135" rx="6" fill="var(--well-bg)" stroke="#eab308" stroke-width="1.5" />
    <text x="35" y="382" class="pin-lbl" fill="#ca8a04">LƯU Ý ĐIỆN ÁP LOGIC RPI4:</text>
    <text x="35" y="402" class="pin-desc">• Mức logic chuẩn: 3.3V (LVCMOS).</text>
    <text x="35" y="420" class="pin-desc">• Các chân GPIO KHÔNG CÓ khả năng chịu 5V (Not 5V-tolerant).</text>
    <text x="35" y="438" class="pin-desc">• Đưa điện áp 5V vào GPIO sẽ phá hủy chân I/O của SoC BCM2711.</text>
    <text x="35" y="456" class="pin-desc">• Dòng tối đa khuyến nghị: 16 mA/chân, tổng không quá 50 mA.</text>
    <text x="35" y="474" class="pin-desc">• Luôn ngắt nguồn điện khi thao tác cắm dây breadboard.</text>
  </g>

  <!-- RIGHT: CIRCUIT SCHEMATIC & CURRENT LIMITING CALCULATION -->
  <g transform="translate(425, 85)">
    <!-- Circuit Box -->
    <rect width="590" height="300" class="card" />
    <text x="20" y="28" class="header-txt">2. MẠCH ĐIỆN VẬT LÝ CHI TIẾT (ACTIVE-HIGH TOPOLOGY)</text>

    <!-- Wire: Pin 11 to Resistor -->
    <line x1="30" y1="80" x2="120" y2="80" class="wire-active" />
    <circle cx="30" cy="80" r="5" fill="var(--wire-active)" />
    <text x="30" y="65" class="pin-lbl" fill="var(--wire-active)">Pin 11 (GPIO17)</text>

    <!-- Resistor Symbol -->
    <rect x="120" y="65" width="80" height="30" rx="4" fill="var(--well-bg)" stroke="var(--resistor-color)" stroke-width="2" />
    <text x="160" y="85" fill="var(--resistor-txt)" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">R = 330 Ω</text>
    <text x="160" y="112" class="pin-desc" text-anchor="middle">Điện trở hạn dòng 1/4W</text>

    <!-- Wire: Resistor to Anode -->
    <line x1="200" y1="80" x2="280" y2="80" class="wire-active" />

    <!-- LED Symbol -->
    <polygon points="280,65 315,80 280,95" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
    <line x1="315" y1="65" x2="315" y2="95" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="295" y1="60" x2="310" y2="45" stroke="#ef4444" stroke-width="1.5" />
    <polygon points="310,45 303,47 308,52" fill="#ef4444" />
    <line x1="305" y1="65" x2="320" y2="50" stroke="#ef4444" stroke-width="1.5" />
    <polygon points="320,50 313,52 318,57" fill="#ef4444" />
    
    <text x="290" y="112" class="pin-lbl" fill="#dc2626">Anode (+)</text>
    <text x="325" y="112" class="pin-lbl" fill="var(--pin-desc)">Cathode (-)</text>
    <text x="300" y="130" class="pin-desc" text-anchor="middle">Đèn LED đỏ (V_F ≈ 2.0V)</text>

    <!-- Wire: Cathode to Ground -->
    <line x1="315" y1="80" x2="420" y2="80" class="wire-gnd" />
    <line x1="420" y1="80" x2="420" y2="150" class="wire-gnd" />
    
    <!-- GND symbol -->
    <line x1="400" y1="150" x2="440" y2="150" stroke="var(--wire-gnd)" stroke-width="3" />
    <line x1="408" y1="156" x2="432" y2="156" stroke="var(--wire-gnd)" stroke-width="2" />
    <line x1="416" y1="162" x2="424" y2="162" stroke="var(--wire-gnd)" stroke-width="1.5" />
    <text x="450" y="155" class="pin-lbl" fill="var(--pin-desc)">Pin 6 (GND)</text>

    <!-- State table inside box -->
    <rect x="30" y="180" width="530" height="95" rx="6" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="45" y="202" class="pin-lbl" fill="#16a34a">TRẠNG THÁI LOGIC ĐIỀU KHIỂN (Active-High):</text>
    <text x="45" y="224" class="calc-txt">• Xuất mức logic 1 (HIGH = 3.3V) → LED sáng (I ≈ 4 mA).</text>
    <text x="45" y="244" class="calc-txt">• Xuất mức logic 0 (LOW = 0V)   → Điện áp bằng 0V → LED tắt hoàn toàn.</text>
    <text x="45" y="264" class="calc-txt">• Cấu hình Device Tree: gpios = &lt;&amp;gpio 17 GPIO_ACTIVE_HIGH&gt;;</text>
  </g>

  <!-- RIGHT LOWER: CALCULATION & OHM'S LAW -->
  <g transform="translate(425, 405)">
    <rect width="590" height="200" class="card" />
    <text x="20" y="28" class="header-txt" fill="#d97706">3. TÍNH TOÁN ĐỊNH LƯỢNG ĐIỆN TRỞ HẠN DÒNG (ĐỊNH LUẬT OHM)</text>

    <rect x="20" y="45" width="550" height="135" rx="8" fill="var(--well-bg)" stroke="var(--well-border)" stroke-width="1" />
    <text x="35" y="70" class="calc-txt">Công thức tính điện trở bảo vệ theo định luật Ohm cho tải LED:</text>
    
    <text x="35" y="98" class="formula">R = (V_OH - V_F) / I_LED</text>
    
    <text x="35" y="122" class="calc-txt">• V_OH = 3.3V (Điện áp mức cao ngõ ra của chân GPIO BCM2711).</text>
    <text x="35" y="140" class="calc-txt">• V_F = 2.0V (Điện áp phân cực thuận sụt trên LED đỏ, 1.8V – 2.2V).</text>
    <text x="35" y="158" class="calc-txt">• Chọn dòng I_LED = 4 mA (0.004 A) → R = (3.3 - 2.0) / 0.004 = 325 Ω → Chọn trở chuẩn 330 Ω.</text>
  </g>
</svg>