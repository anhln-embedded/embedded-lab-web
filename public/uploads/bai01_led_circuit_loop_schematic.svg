<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #f8fafc;
        --canvas-border: #e2e8f0;
        --title-color: #0f172a;
        --subtitle-color: #475569;
        
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --card-header-bg: #f1f5f9;
        --card-header-border: #94a3b8;
        --card-header-title: #0f172a;
        
        --accent-card-bg: #f0f9ff;
        --accent-card-border: #0284c7;
        --accent-header-bg: #e0f2fe;
        --accent-header-title: #0369a1;
        
        --safe-card-bg: #f0fdf4;
        --safe-card-border: #16a34a;
        --safe-card-title: #15803d;
        --safe-card-desc: #166534;
        
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --code-accent: #0284c7;
        --math-val: #b45309;
        
        --wire: #0284c7;
        --wire-gnd: #64748b;
        --kvl-loop: #d97706;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #0b1120;
          --canvas-border: #1e293b;
          --title-color: #f8fafc;
          --subtitle-color: #94a3b8;
          
          --card-bg: #1e293b;
          --card-border: #334155;
          --card-header-bg: #1e1b4b;
          --card-header-border: #6366f1;
          --card-header-title: #a5b4fc;
          
          --accent-card-bg: #0f172a;
          --accent-card-border: #38bdf8;
          --accent-header-bg: #0f2b48;
          --accent-header-title: #38bdf8;
          
          --safe-card-bg: #052e16;
          --safe-card-border: #22c55e;
          --safe-card-title: #4ade80;
          --safe-card-desc: #bbf7d0;
          
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --code-accent: #38bdf8;
          --math-val: #fbbf24;
          
          --wire: #38bdf8;
          --wire-gnd: #64748b;
          --kvl-loop: #f59e0b;
        }
      }

      .canvas-bg { fill: var(--canvas-bg); stroke: var(--canvas-border); stroke-width: 1.5; }
      .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.5; rx: 12px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: var(--title-color); text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--subtitle-color); text-anchor: middle; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--text-muted); }
      .code-sm { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: var(--code-accent); }
      .math-val { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 700; fill: var(--math-val); }
      
      .wire { stroke: var(--wire); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-gnd { stroke: var(--wire-gnd); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .kvl-loop { stroke: var(--kvl-loop); stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--wire)"/>
    </marker>
    <marker id="arrow-kvl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--kvl-loop)"/>
    </marker>
  </defs>

  <rect width="1020" height="420" class="canvas-bg" rx="16"/>

  <text x="510" y="38" class="title">SƠ ĐỒ VÒNG KÍN MẠCH ĐỆM GPIO17 &amp; ĐỊNH LUẬT KIRCHHOFF (KVL)</text>
  <text x="510" y="62" class="subtitle">Mô hình phân cực thuận diode LED, điện áp sụt trên điện trở R và dòng định mức an toàn cho SoC BCM2711</text>

  <!-- Stage 1: GPIO17 Output Driver (Pin 11) -->
  <rect x="40" y="90" width="230" height="230" class="card"/>
  <rect x="55" y="105" width="200" height="30" rx="6" fill="var(--card-header-bg)" stroke="var(--card-header-border)" stroke-width="1"/>
  <text x="155" y="125" class="block-title" fill="var(--card-header-title)" text-anchor="middle">BCM2711 SoC Output</text>
  <text x="55" y="160" class="text-sm">Chân vật lý: <tspan class="code-sm">Pin 11 (GPIO17)</tspan></text>
  <text x="55" y="185" class="text-sm">Tầng đệm ngõ ra: <tspan class="text-sm" fill="var(--text-primary)">Push-Pull Driver</tspan></text>
  <text x="55" y="210" class="text-sm">Trạng thái High: <tspan class="math-val">V_OH = 3.3V</tspan></text>
  <text x="55" y="235" class="text-sm">Chuẩn giao tiếp: <tspan class="text-sm" fill="var(--text-primary)">LVCMOS Logic</tspan></text>
  <text x="55" y="260" class="text-sm">Giới hạn dòng cực đại: <tspan class="text-sm" fill="#ef4444">I_MAX = 16 mA</tspan></text>
  <circle cx="270" cy="205" r="5" fill="var(--wire)"/>
  <text x="250" y="195" class="code-sm" font-size="11px">Pin 11</text>

  <!-- Wire 1: SoC to Resistor -->
  <path d="M 270 205 L 350 205" class="wire" marker-end="url(#arrow)"/>
  <text x="310" y="195" class="math-val" font-size="11px" text-anchor="middle">I_LED →</text>

  <!-- Stage 2: Current Limiting Resistor (330 Ohm) -->
  <rect x="360" y="90" width="230" height="230" rx="12" fill="var(--accent-card-bg)" stroke="var(--accent-card-border)" stroke-width="1.5"/>
  <rect x="375" y="105" width="200" height="30" rx="6" fill="var(--accent-header-bg)" stroke="var(--accent-card-border)" stroke-width="1"/>
  <text x="475" y="125" class="block-title" fill="var(--accent-header-title)" text-anchor="middle">Điện Trở Hạn Dòng R</text>
  
  <g transform="translate(420, 150)">
    <path d="M 0 15 L 20 15 L 28 0 L 44 30 L 60 0 L 76 30 L 92 0 L 100 15 L 115 15" stroke="var(--wire)" stroke-width="3" fill="none"/>
  </g>
  <text x="475" y="205" class="math-val" font-size="16px" text-anchor="middle">R = 330 Ω (1/4W)</text>
  <text x="380" y="235" class="text-sm">Độ sụt áp: <tspan class="math-val">V_R = I_LED × R</tspan></text>
  <text x="380" y="260" class="text-sm">Giá trị thực tế: <tspan class="math-val">V_R ≈ 1.30 V</tspan></text>
  <text x="380" y="285" class="text-sm">Công suất tiêu tán: <tspan class="text-sm" fill="var(--text-primary)">P_R ≈ 5.1 mW</tspan></text>

  <!-- Wire 2: Resistor to LED Anode -->
  <path d="M 590 205 L 670 205" class="wire" marker-end="url(#arrow)"/>
  <text x="630" y="195" class="math-val" font-size="11px" text-anchor="middle">Anode (+)</text>

  <!-- Stage 3: Red LED -->
  <rect x="680" y="90" width="200" height="230" class="card"/>
  <rect x="695" y="105" width="170" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="780" y="125" class="block-title" fill="#b91c1c" text-anchor="middle">Đèn LED Đỏ (5mm)</text>
  
  <g transform="translate(745, 145)">
    <line x1="0" y1="20" x2="25" y2="20" stroke="#ef4444" stroke-width="3"/>
    <polygon points="25,5 25,35 55,20" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="55" y1="5" x2="55" y2="35" stroke="#ef4444" stroke-width="3"/>
    <line x1="55" y1="20" x2="75" y2="20" stroke="#ef4444" stroke-width="3"/>
    <line x1="45" y1="5" x2="55" y2="-5" stroke="#f59e0b" stroke-width="2"/>
    <line x1="55" y1="10" x2="65" y2="0" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="780" y="205" class="text-sm" text-anchor="middle">Ngưỡng mở: <tspan class="math-val">V_F ≈ 2.0 V</tspan></text>
  <text x="700" y="235" class="text-sm">Cực dương: <tspan class="text-sm" fill="var(--text-primary)">Chân dài (Anode)</tspan></text>
  <text x="700" y="260" class="text-sm">Cực âm: <tspan class="text-sm" fill="var(--text-primary)">Chân vát (Cathode)</tspan></text>
  <text x="700" y="285" class="text-sm">Bước sóng: <tspan class="text-sm" fill="var(--text-primary)">λ ≈ 625 nm (Red)</tspan></text>

  <!-- Wire 3: LED Cathode to Ground Return -->
  <path d="M 880 205 L 940 205 L 940 370 L 155 370 L 155 320" class="wire-gnd"/>
  <circle cx="940" cy="205" r="4" fill="var(--wire-gnd)"/>
  <text x="940" y="195" class="text-sm" fill="var(--text-muted)" text-anchor="middle">Cathode (-)</text>

  <!-- Ground Symbol -->
  <g transform="translate(500, 360)">
    <line x1="-20" y1="10" x2="20" y2="10" stroke="var(--wire-gnd)" stroke-width="3"/>
    <line x1="-12" y1="16" x2="12" y2="16" stroke="var(--wire-gnd)" stroke-width="2.5"/>
    <line x1="-5" y1="22" x2="5" y2="22" stroke="var(--wire-gnd)" stroke-width="2"/>
    <text x="0" y="42" class="code-sm" fill="var(--text-muted)" font-size="11px" text-anchor="middle">Pin 6 (GND = 0V)</text>
  </g>

  <!-- KVL Closed Loop Annotation -->
  <path d="M 320 280 C 370 310, 600 310, 680 280" class="kvl-loop" marker-end="url(#arrow-kvl)"/>
  <text x="500" y="315" class="math-val" font-size="13px" text-anchor="middle">Vòng KVL: V_OH - V_R - V_F = 0 ⟹ 3.3V - 1.3V - 2.0V = 0</text>

  <!-- Bottom Safe Verification Box -->
  <rect x="680" y="345" width="280" height="50" rx="8" fill="var(--safe-card-bg)" stroke="var(--safe-card-border)" stroke-width="1.5"/>
  <text x="695" y="367" class="block-title" fill="var(--safe-card-title)" font-size="13px">✓ DÒNG THỰC TẾ: I_LED ≈ 3.94 mA</text>
  <text x="695" y="385" class="text-sm" fill="var(--safe-card-desc)">An toàn tuyệt đối (&lt; 16 mA của BCM2711)</text>
</svg>