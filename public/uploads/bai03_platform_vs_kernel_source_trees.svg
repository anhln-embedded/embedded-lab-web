<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #f8fafc;
        --canvas-border: #e2e8f0;
        --title: #0f172a;
        --subtitle: #475569;
        
        --box-pf-bg: #eff6ff;
        --box-pf-border: #93c5fd;
        --box-pf-title: #1e40af;
        --box-pf-sub: #3b82f6;
        --box-pf-card-bg: #ffffff;
        --box-pf-card-border: #bfdbfe;
        --box-pf-out-bg: #e0f2fe;
        --box-pf-out-border: #38bdf8;
        --box-pf-out-txt: #0369a1;
        
        --box-k-bg: #f0fdf4;
        --box-k-border: #86efac;
        --box-k-title: #15803d;
        --box-k-sub: #22c55e;
        --box-k-card-bg: #ffffff;
        --box-k-card-border: #bbf7d0;
        --box-k-out-bg: #dcfce7;
        --box-k-out-border: #4ade80;
        --box-k-out-txt: #166534;
        
        --node-hdr: #0f172a;
        --node-body: #334155;
        --code-line: #0369a1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #0b1120;
          --canvas-border: #1e293b;
          --title: #f8fafc;
          --subtitle: #94a3b8;
          
          --box-pf-bg: #1e1b4b;
          --box-pf-border: #6366f1;
          --box-pf-title: #a5b4fc;
          --box-pf-sub: #c7d2fe;
          --box-pf-card-bg: #0f172a;
          --box-pf-card-border: #4338ca;
          --box-pf-out-bg: #1e1b4b;
          --box-pf-out-border: #818cf8;
          --box-pf-out-txt: #818cf8;
          
          --box-k-bg: #064e3b;
          --box-k-border: #10b981;
          --box-k-title: #6ee7b7;
          --box-k-sub: #a7f3d0;
          --box-k-card-bg: #0f172a;
          --box-k-card-border: #047857;
          --box-k-out-bg: #064e3b;
          --box-k-out-border: #34d399;
          --box-k-out-txt: #34d399;
          
          --node-hdr: #ffffff;
          --node-body: #cbd5e1;
          --code-line: #38bdf8;
        }
      }

      .canvas-bg { fill: var(--canvas-bg); stroke: var(--canvas-border); stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: var(--title); text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--subtitle); text-anchor: middle; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      
      .node-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: var(--node-hdr); }
      .node-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--node-body); }
      .code-line { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: var(--code-line); }
    </style>
  </defs>

  <rect width="1020" height="540" class="canvas-bg" rx="16" />

  <text x="510" y="38" class="title">PHÂN TÁCH CÂY MÃ NGUỒN: ANDROID PLATFORM TREE VS KERNEL TREE</text>
  <text x="510" y="62" class="subtitle">Hai Hệ Thống Độc Lập Về Repo Manifest, Bộ Công Cụ Biên Dịch Và Sản Phẩm Đầu Ra Trong AOSP</text>

  <!-- LEFT: ANDROID PLATFORM TREE -->
  <g transform="translate(35, 85)">
    <rect width="455" height="425" rx="12" fill="var(--box-pf-bg)" stroke="var(--box-pf-border)" stroke-width="2" />
    <text x="25" y="32" class="col-title" fill="var(--box-pf-title)">1. ANDROID PLATFORM SOURCE TREE</text>
    <text x="25" y="52" font-family="sans-serif" font-size="11" fill="var(--box-pf-sub)">Dung lượng: ~300 GB • Build Tool: Soong (Android.bp) / Kati</text>

    <!-- Source Origin -->
    <rect x="20" y="68" width="415" height="95" rx="6" fill="var(--box-pf-card-bg)" stroke="var(--box-pf-card-border)" stroke-width="1" />
    <text x="32" y="90" class="node-hdr">Repo Manifest &amp; Phân Nhánh:</text>
    <text x="32" y="110" class="code-line">• URL: android.googlesource.com/platform/manifest</text>
    <text x="32" y="128" class="code-line">• Branch: android-17.0.0_r1 (Platform Release)</text>
    <text x="32" y="146" class="code-line">• Local Manifest: raspberry-vanilla/android_local_manifest</text>

    <!-- Component Content -->
    <rect x="20" y="175" width="415" height="115" rx="6" fill="var(--box-pf-card-bg)" stroke="var(--box-pf-card-border)" stroke-width="1" />
    <text x="32" y="197" class="node-hdr">Thành Phần Chứa Bên Trong:</text>
    <text x="32" y="217" class="node-body">• Android Framework (Java/Kotlin, system_server, ART)</text>
    <text x="32" y="235" class="node-body">• Stable AIDL Interfaces (`hardware/interfaces/`)</text>
    <text x="32" y="253" class="node-body">• Cấu hình thiết bị &amp; SELinux Policy (`device/brcm/rpi4/`)</text>
    <text x="32" y="271" class="node-body">• Ứng dụng hệ thống &amp; Trình khởi tạo `init`, `ueventd`</text>

    <!-- Artifacts Output -->
    <rect x="20" y="302" width="415" height="95" rx="6" fill="var(--box-pf-out-bg)" stroke="var(--box-pf-out-border)" stroke-width="1" />
    <text x="32" y="324" class="node-hdr" fill="var(--box-pf-out-txt)">Sản Phẩm Đầu Ra (Build Artifacts):</text>
    <text x="32" y="344" class="code-line" fill="var(--box-pf-out-txt)">• system.img (Android Framework &amp; Apps)</text>
    <text x="32" y="362" class="code-line" fill="var(--box-pf-out-txt)">• vendor.img (HAL Binaries &amp; Proprietary Blobs)</text>
    <text x="32" y="380" class="code-line" fill="var(--box-pf-out-txt)">• product.img &amp; system_ext.img</text>
  </g>

  <!-- RIGHT: ANDROID KERNEL TREE -->
  <g transform="translate(530, 85)">
    <rect width="455" height="425" rx="12" fill="var(--box-k-bg)" stroke="var(--box-k-border)" stroke-width="2" />
    <text x="25" y="32" class="col-title" fill="var(--box-k-title)">2. ANDROID KERNEL SOURCE TREE</text>
    <text x="25" y="52" font-family="sans-serif" font-size="11" fill="var(--box-k-sub)">Dung lượng: ~40 GB • Build Tool: Google Kleaf / Bazel</text>

    <!-- Source Origin -->
    <rect x="20" y="68" width="415" height="95" rx="6" fill="var(--box-k-card-bg)" stroke="var(--box-k-card-border)" stroke-width="1" />
    <text x="32" y="90" class="node-hdr">Repo Manifest &amp; Phân Nhánh:</text>
    <text x="32" y="110" class="code-line">• URL: android.googlesource.com/kernel/manifest</text>
    <text x="32" y="128" class="code-line">• Branch: common-android17-6.18-lts (GKI Branch)</text>
    <text x="32" y="146" class="code-line">• Local Manifest: raspberry-vanilla/android_kernel_manifest</text>

    <!-- Component Content -->
    <rect x="20" y="175" width="415" height="115" rx="6" fill="var(--box-k-card-bg)" stroke="var(--box-k-card-border)" stroke-width="1" />
    <text x="32" y="197" class="node-hdr">Thành Phần Chứa Bên Trong:</text>
    <text x="32" y="217" class="node-body">• Nhân Linux nguyên bản (Linux 6.18.38 Long Term Support)</text>
    <text x="32" y="235" class="node-body">• Device Drivers ngoại vi &amp; Giao diện GPIO / SPI / I2C / LEDs</text>
    <text x="32" y="253" class="node-body">• Device Tree Sources (`.dts`, `.dtsi`) cho Broadcom BCM2711</text>
    <text x="32" y="271" class="node-body">• Hệ thống build Kleaf (`build/kernel/kleaf/`) &amp; Bazel sandbox</text>

    <!-- Artifacts Output -->
    <rect x="20" y="302" width="415" height="95" rx="6" fill="var(--box-k-out-bg)" stroke="var(--box-k-out-border)" stroke-width="1" />
    <text x="32" y="324" class="node-hdr" fill="var(--box-k-out-txt)">Sản Phẩm Đầu Ra (Build Artifacts):</text>
    <text x="32" y="344" class="code-line" fill="var(--box-k-out-txt)">• boot.img &amp; Image (Linux Kernel Binary vmlinux)</text>
    <text x="32" y="362" class="code-line" fill="var(--box-k-out-txt)">• bcm2711-rpi-4-b.dtb &amp; Overlays (*.dtbo)</text>
    <text x="32" y="380" class="code-line" fill="var(--box-k-out-txt)">• *.ko (GKI Loadable Kernel Modules)</text>
  </g>
</svg>