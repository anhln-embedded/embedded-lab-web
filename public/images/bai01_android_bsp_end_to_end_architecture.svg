<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .layer-card { rx: 12px; stroke-width: 1.5; }
      .app-layer { fill: #1e1b4b; stroke: #6366f1; }
      .fw-layer { fill: #172554; stroke: #3b82f6; }
      .ipc-layer { fill: #451a03; stroke: #f59e0b; }
      .hal-layer { fill: #3b0764; stroke: #a855f7; }
      .kernel-layer { fill: #064e3b; stroke: #10b981; }
      .hw-layer { fill: #1e293b; stroke: #64748b; }
      
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; text-anchor: middle; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #cbd5e1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 800; fill: #0f172a; }
      
      .inner-box { fill: #0f172a; stroke-width: 1; rx: 8px; }
      .flow-arrow { stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
    </style>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="850" class="bg" rx="16" />

  <!-- Main Header -->
  <text x="550" y="40" class="title-text">KIẾN TRÚC TOÀN TRÌNH ANDROID BSP &amp; LED SUBSYSTEM TRÊN RASPBERRY PI 4</text>
  <text x="550" y="65" class="subtitle-text">Từ Ứng Dụng Java, Framework System Service, Stable AIDL HAL Đến Linux Kernel &amp; GPIO Phần Cứng</text>

  <!-- LAYER 1: ANDROID APPLICATION -->
  <g transform="translate(40, 85)">
    <rect width="1020" height="95" class="layer-card app-layer" />
    <text x="20" y="25" class="layer-title" fill="#a5b4fc">1. APPLICATION LAYER (Userspace - App UID Sandbox)</text>
    
    <!-- Component 1: UI Activity -->
    <rect x="30" y="38" width="300" height="45" class="inner-box" stroke="#818cf8" />
    <text x="45" y="56" class="box-title">MainActivity.java (LedController.apk)</text>
    <text x="45" y="72" class="box-desc">Nút bấm: ON / OFF / BLINK • Nhập delay_on / delay_off</text>
    
    <!-- Flow Connector -->
    <line x1="335" y1="60" x2="385" y2="60" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-down)" />
    
    <!-- Component 2: Client SDK -->
    <rect x="390" y="38" width="310" height="45" class="inner-box" stroke="#818cf8" />
    <text x="405" y="56" class="box-title">LedManager.java (Custom SDK Client API)</text>
    <text x="405" y="72" class="box-desc">Context.getSystemService(LedManager.class) • AIDL Proxy</text>
    
    <!-- Component 3: Security & Permissions -->
    <rect x="730" y="38" width="260" height="45" class="inner-box" stroke="#f43f5e" />
    <text x="745" y="56" class="box-title" fill="#fda4af">Permission Checking Model</text>
    <text x="745" y="72" class="box-desc">android.permission.CONTROL_LED (Signature/Privileged)</text>
  </g>

  <!-- Inter-layer Flow Arrow 1 -->
  <line x1="545" y1="180" x2="545" y2="205" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <text x="555" y="196" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">IPC: ILedManager.aidl</text>

  <!-- LAYER 2: ANDROID FRAMEWORK -->
  <g transform="translate(40, 205)">
    <rect width="1020" height="110" class="layer-card fw-layer" />
    <text x="20" y="25" class="layer-title" fill="#93c5fd">2. ANDROID FRAMEWORK LAYER (system_server / System Context)</text>
    
    <!-- Box 1: SystemServer -->
    <rect x="30" y="38" width="280" height="60" class="inner-box" stroke="#60a5fa" />
    <text x="45" y="58" class="box-title">SystemServer.java (Bootstrap/Other)</text>
    <text x="45" y="74" class="box-desc">Khởi tạo và đăng ký Service vào</text>
    <text x="45" y="88" class="box-desc">ServiceManager.addService("led_custom", ...)</text>

    <!-- Box 2: LedService -->
    <rect x="330" y="38" width="350" height="60" class="inner-box" stroke="#60a5fa" />
    <text x="345" y="58" class="box-title">LedService.java (ILedManager.Stub)</text>
    <text x="345" y="74" class="box-desc">Kiểm tra quyền enforceCallingOrSelfPermission()</text>
    <text x="345" y="88" class="box-desc">Quản lý Timer, Thread worker, Binder Death Recipient</text>

    <!-- Box 3: HAL Connector -->
    <rect x="700" y="38" width="290" height="60" class="inner-box" stroke="#38bdf8" />
    <text x="715" y="58" class="box-title">Vendor HAL Client Binder Proxy</text>
    <text x="715" y="74" class="box-desc">ILed.Stub.asInterface(ServiceManager</text>
    <text x="715" y="88" class="box-desc">.waitForDeclaredService("vendor...ILed/default"))</text>
  </g>

  <!-- Inter-layer Flow Arrow 2: SYSTEM / VENDOR BOUNDARY -->
  <g transform="translate(40, 325)">
    <rect width="1020" height="42" class="layer-card ipc-layer" />
    <text x="20" y="26" class="layer-title" fill="#fcd34d">3. SYSTEM / VENDOR BOUNDARY (Treble Architecture &amp; VINTF)</text>
    <text x="460" y="26" font-family="sans-serif" font-size="11" fill="#fef08a" font-weight="600">Stable AIDL (@VintfStability) • /dev/binder • Compatibility Matrix XML</text>
  </g>

  <!-- LAYER 4: VENDOR HAL LAYER -->
  <g transform="translate(40, 377)">
    <rect width="1020" height="120" class="layer-card hal-layer" />
    <text x="20" y="25" class="layer-title" fill="#d8b4fe">4. VENDOR HARDWARE ABSTRACTION LAYER (Native C++ AIDL Daemon)</text>

    <!-- Sub 1: AIDL Interface -->
    <rect x="30" y="38" width="260" height="70" class="inner-box" stroke="#c084fc" />
    <text x="45" y="58" class="box-title">ILed.aidl (@VintfStability)</text>
    <text x="45" y="74" class="box-desc">package vendor.example.hardware.led;</text>
    <text x="45" y="88" class="box-desc">void setLed(boolean on);</text>
    <text x="45" y="100" class="box-desc">void setBlink(boolean on, int onMs, int offMs);</text>

    <!-- Sub 2: HAL Daemon -->
    <rect x="310" y="38" width="370" height="70" class="inner-box" stroke="#c084fc" />
    <text x="325" y="58" class="box-title">vendor.example.hardware.led-service (C++ NDK)</text>
    <text x="325" y="74" class="box-desc">libbinder_ndk • AServiceManager_addService()</text>
    <text x="325" y="88" class="box-desc">Thao tác I/O an toàn tới /sys/class/leds/user-led/</text>
    <text x="325" y="100" class="box-desc">Không dùng system() hay popen() để tránh Command Injection</text>

    <!-- Sub 3: Init & SELinux -->
    <rect x="700" y="38" width="290" height="70" class="inner-box" stroke="#ec4899" />
    <text x="715" y="58" class="box-title" fill="#fbcfe8">VINTF, Init &amp; SELinux Policy</text>
    <text x="715" y="74" class="box-desc">vintf_manifest: vendor.example.hardware.led</text>
    <text x="715" y="88" class="box-desc">init.rc: service vendor.led-hal (class hal)</text>
    <text x="715" y="100" class="box-desc">sepolicy: type vendor_led_hal, exec, domain</text>
  </g>

  <!-- Inter-layer Flow Arrow 3 -->
  <line x1="545" y1="497" x2="545" y2="520" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <text x="555" y="513" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">Sysfs File I/O: write(fd, "1\n", 2)</text>

  <!-- LAYER 5: LINUX KERNEL SPACE -->
  <g transform="translate(40, 520)">
    <rect width="1020" height="150" class="layer-card kernel-layer" />
    <text x="20" y="25" class="layer-title" fill="#6ee7b7">5. LINUX KERNEL SPACE (Linux 6.18 LTS / GKI &amp; Device Tree)</text>

    <!-- Kernel Component 1: Sysfs Entry -->
    <rect x="30" y="38" width="280" height="95" class="inner-box" stroke="#34d399" />
    <text x="45" y="58" class="box-title">Linux LED Class (/sys/class/leds/)</text>
    <text x="45" y="74" class="box-desc">• brightness (0 / 1 / max_brightness)</text>
    <text x="45" y="88" class="box-desc">• trigger (none, timer, heartbeat...)</text>
    <text x="45" y="102" class="box-desc">• delay_on / delay_off (ms)</text>
    <text x="45" y="116" class="box-desc">Được tạo tự động bởi led-class driver</text>

    <!-- Kernel Component 2: Driver & Subsystem -->
    <rect x="330" y="38" width="350" height="95" class="inner-box" stroke="#34d399" />
    <text x="345" y="58" class="box-title">drivers/leds/leds-gpio.c (gpio-leds driver)</text>
    <text x="345" y="74" class="box-desc">• devm_gpiod_get_from_of_node()</text>
    <text x="345" y="88" class="box-desc">• gpiod_set_value_cansleep()</text>
    <text x="345" y="102" class="box-desc">• Linux GPIO Descriptor Framework (gpiolib)</text>
    <text x="345" y="116" class="box-desc">• Tương thích hoàn toàn out-of-tree Kleaf/Bazel</text>

    <!-- Kernel Component 3: Device Tree -->
    <rect x="700" y="38" width="290" height="95" class="inner-box" stroke="#34d399" />
    <text x="715" y="58" class="box-title">Device Tree Overlay (led-gpio.dtbo)</text>
    <text x="715" y="74" class="box-desc">compatible = "gpio-leds";</text>
    <text x="715" y="88" class="box-desc">label = "user-led";</text>
    <text x="715" y="102" class="box-desc">gpios = &lt;&amp;gpio 17 GPIO_ACTIVE_HIGH&gt;;</text>
    <text x="715" y="116" class="box-desc">default-state = "off";</text>
  </g>

  <!-- Inter-layer Flow Arrow 4 -->
  <line x1="545" y1="670" x2="545" y2="695" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <text x="555" y="687" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold">Hardware Register MMIO: BCM2711 GPSET0 / GPCLR0</text>

  <!-- LAYER 6: PHYSICAL HARDWARE -->
  <g transform="translate(40, 695)">
    <rect width="1020" height="125" class="layer-card hw-layer" />
    <text x="20" y="25" class="layer-title" fill="#e2e8f0">6. PHYSICAL HARDWARE LAYER (Raspberry Pi 4 Model B &amp; LED Circuit)</text>

    <!-- HW 1: SoC -->
    <rect x="30" y="38" width="270" height="75" class="inner-box" stroke="#94a3b8" />
    <text x="45" y="58" class="box-title">Broadcom BCM2711 SoC</text>
    <text x="45" y="74" class="box-desc">Quad-core Cortex-A72 @ 1.5/1.8 GHz</text>
    <text x="45" y="88" class="box-desc">GPIO Controller Block (0xfe200000)</text>
    <text x="45" y="102" class="box-desc">Logic level: 3.3V LVCMOS (Tối đa 16mA/pin)</text>

    <!-- HW 2: Header Pinout -->
    <rect x="320" y="38" width="370" height="75" class="inner-box" stroke="#94a3b8" />
    <text x="335" y="58" class="box-title">Raspberry Pi 4 40-Pin Expansion Header</text>
    <text x="335" y="74" class="box-desc">• Physical Pin 11: BCM GPIO17 (Ngõ ra điều khiển)</text>
    <text x="335" y="88" class="box-desc">• Physical Pin 6: GND (Chân tiếp địa mạch điện)</text>
    <text x="335" y="102" class="box-desc">⚠️ Tuyệt đối không chạm vào Pin 2 &amp; 4 (5V Power Bus)</text>

    <!-- HW 3: LED Circuit -->
    <rect x="710" y="38" width="280" height="75" class="inner-box" stroke="#22c55e" />
    <text x="725" y="58" class="box-title" fill="#86efac">Mạch Điện Đèn LED Bảo Vệ</text>
    <text x="725" y="74" class="box-desc">GPIO17 (Pin 11) → R_hạn_dòng (330 Ω)</text>
    <text x="725" y="88" class="box-desc">→ Anode (+) Đèn LED đỏ (V_f ≈ 2.0V)</text>
    <text x="725" y="102" class="box-desc">→ Cathode (-) Đèn LED → GND (Pin 6)</text>
  </g>
</svg>
