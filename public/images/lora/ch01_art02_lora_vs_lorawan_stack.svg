<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Border -->
  <rect x="15" y="15" width="930" height="590" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800">SO SÁNH NGĂN XẾP GIAO THỨC: LORA (PHY) VS LORAWAN (MAC)</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">Phân định ranh giới kiến trúc, tổ chức sở hữu và cơ chế vận hành theo mô hình OSI</text>
  </g>

  <!-- Left: OSI Reference Layers -->
  <g transform="translate(50, 100)">
    <text x="50" y="20" fill="#64748b" font-size="12" font-weight="700" text-anchor="middle">MÔ HÌNH OSI</text>
    
    <!-- Application Layer -->
    <rect x="0" y="35" width="100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="75" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Application</text>

    <!-- Network / Transport Layer -->
    <rect x="0" y="115" width="100" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="152" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Network /</text>
    <text x="50" y="168" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Transport</text>

    <!-- Data Link Layer -->
    <rect x="0" y="205" width="100" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="275" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Data Link</text>
    <text x="50" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">(MAC Layer)</text>

    <!-- Physical Layer -->
    <rect x="0" y="365" width="100" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="420" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Physical</text>
    <text x="50" y="438" fill="#94a3b8" font-size="10" text-anchor="middle">(PHY Layer)</text>
  </g>

  <!-- Middle: LoRaWAN Specification Scope -->
  <g transform="translate(175, 100)">
    <!-- Header: LoRaWAN (LoRa Alliance) -->
    <rect x="0" y="0" width="735" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="367" y="19" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">
      CHUẨN MỞ LORAWAN® (ĐIỀU HÀNH BỞI LORA ALLIANCE®)
    </text>

    <!-- Application Payload Block -->
    <rect x="0" y="35" width="735" height="70" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="25" y="65" fill="#93c5fd" font-size="13" font-weight="700">Tầng Ứng Dụng (Application Layer)</text>
    <text x="25" y="86" fill="#94a3b8" font-size="11">Dữ liệu cảm biến nhiệt độ, áp suất, định vị GPS, công tơ điện thông minh, điều khiển thiết bị (MQTT / Webhook / REST API)</text>

    <!-- LoRaWAN MAC Layer Core -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="735" height="240" rx="10" fill="#0d1b2a" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
      <text x="25" y="30" fill="#60a5fa" font-size="14" font-weight="800">Tầng Giao Thức Mạng LoRaWAN MAC</text>
      <text x="25" y="48" fill="#94a3b8" font-size="11">Quản trị kết nối, bảo mật mã hóa kép AES-128, điều tiết phổ tần và phân loại thiết bị</text>

      <!-- 3 Device Classes Grid -->
      <g transform="translate(25, 62)">
        <!-- Class A -->
        <rect x="0" y="0" width="215" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">Class A (Cơ Bản)</text>
        <text x="15" y="44" fill="#cbd5e1" font-size="10">2 cửa sổ nhận tin (RX1/RX2) sau TX.</text>
        <text x="15" y="62" fill="#10b981" font-size="10" font-weight="600">🔋 Tiết kiệm năng lượng tối đa</text>

        <!-- Class B -->
        <rect x="235" y="0" width="215" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">Class B (Định Thời)</text>
        <text x="15" y="44" fill="#cbd5e1" font-size="10">Đồng bộ xung Beacon từ Gateway.</text>
        <text x="15" y="62" fill="#38bdf8" font-size="10" font-weight="600">⏱️ Mở khe Ping Slot định kỳ</text>

        <!-- Class C -->
        <rect x="470" y="0" width="215" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">Class C (Liên Tục)</text>
        <text x="15" y="44" fill="#cbd5e1" font-size="10">Lắng nghe nhận tin liên tục không nghỉ.</text>
        <text x="15" y="62" fill="#f59e0b" font-size="10" font-weight="600">⚡ Độ trễ cực thấp (Cần nguồn lưới)</text>
      </g>

      <!-- Security & Commands Sub-row -->
      <g transform="translate(25, 155)">
        <rect x="0" y="0" width="685" height="70" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" fill="#34d399" font-size="12" font-weight="700">🔒 Quản lý Bảo mật &amp; Lệnh MAC (MAC Commands)</text>
        <text x="15" y="46" fill="#94a3b8" font-size="11">
          • Kích hoạt: <tspan fill="#f8fafc" font-weight="600">OTAA (Over-the-Air)</tspan> hoặc <tspan fill="#f8fafc" font-weight="600">ABP (Personalization)</tspan> | Khóa mã hóa: <tspan fill="#38bdf8" font-weight="600">AppSKey (Ứng dụng)</tspan> &amp; <tspan fill="#38bdf8" font-weight="600">NwkSKey (Mạng)</tspan>
        </text>
        <text x="15" y="62" fill="#94a3b8" font-size="11">
          • Lệnh MAC: <tspan fill="#f8fafc">LinkCheckReq, LinkADRReq (Tự động thích ứng tốc độ), DutyCycle, RXTimingSetup</tspan>
        </text>
      </g>
    </g>

    <!-- LoRa Physical Layer (Semtech Proprietary) -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="735" height="100" rx="10" fill="#062e2d" stroke="#059669" stroke-width="2" filter="url(#boxShadow)"/>
      <g transform="translate(25, 22)">
        <text x="0" y="0" fill="#34d399" font-size="14" font-weight="800">Tầng Vật Lý Vô Tuyến: LoRa® PHY (Bản quyền Semtech)</text>
        <text x="0" y="20" fill="#a7f3d0" font-size="11">Kỹ thuật điều chế Chirp Spread Spectrum (CSS) kết hợp FSK fallback</text>
        
        <g transform="translate(0, 34)">
          <rect x="0" y="0" width="215" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
          <text x="107" y="20" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Spreading Factor: SF7 - SF12</text>

          <rect x="235" y="0" width="215" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
          <text x="342" y="20" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Băng thông (BW): 125 / 250 / 500 kHz</text>

          <rect x="470" y="0" width="215" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
          <text x="577" y="20" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Tốc độ sửa lỗi: CR 4/5 đến 4/8</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Regional Frequency Bands Bottom Banner -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="860" height="75" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="26" fill="#38bdf8" font-size="12" font-weight="700">DẢI TẦN SỐ KHÔNG CẦN CẤP PHÉP (ISM BANDS) THEO KHU VỰC ĐỊA LÝ (RP002-1.0.4)</text>
    
    <g transform="translate(25, 40)">
      <text x="0" y="16" fill="#e2e8f0" font-size="11">
        • <tspan fill="#34d399" font-weight="700">AS923 (Châu Á &amp; Việt Nam):</tspan> 920 - 923 MHz (AS923-2)
      </text>
      <text x="310" y="16" fill="#e2e8f0" font-size="11">
        • <tspan fill="#38bdf8" font-weight="700">EU868 (Châu Âu):</tspan> 863 - 870 MHz (Duty cycle 1%)
      </text>
      <text x="610" y="16" fill="#e2e8f0" font-size="11">
        • <tspan fill="#c084fc" font-weight="700">US915 (Bắc Mỹ):</tspan> 902 - 928 MHz (64+8 Uplinks)
      </text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="585" fill="#475569" font-size="11">Thiết kế bởi Embedded-AIoT Lab — Bài 02: Phân biệt rõ LoRa (PHY Radio) và LoRaWAN (Network MAC Protocol)</text>
</svg>

