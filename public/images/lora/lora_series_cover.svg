<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="#090d16"/>
  <rect width="1200" height="630" fill="url(#heroGlow)"/>
  <rect width="1200" height="630" fill="url(#meshGlow)"/>

  <!-- Subtle RF Grid Lines -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Header & Branding -->
  <g transform="translate(80, 80)">
    <!-- Lab Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="18" r="6" fill="#10b981"/>
    <text x="34" y="23" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">EMBEDDED-AIOT LAB PTIT</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1">LoRa &amp; LoRaWAN</text>
    <text x="0" y="145" fill="url(#cyanLine)" font-size="34" font-weight="800">Từ Nền Tảng Đến Ứng Dụng Thực Chiến</text>

    <!-- Subtitle / Meta -->
    <text x="0" y="195" fill="#94a3b8" font-size="16" font-weight="500" max-width="500">
      Chương trình đào tạo chuyên sâu về Công nghệ Vô tuyến LPWAN,
    </text>
    <text x="0" y="222" fill="#94a3b8" font-size="16" font-weight="500">
      Điều chế CSS, Chip Semtech SX1262, Trạm Gateway và Hạ tầng ChirpStack.
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <text x="65" y="21" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">8 CHƯƠNG</text>

      <rect x="145" y="0" width="140" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="215" y="21" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">40 CHUYÊN ĐỀ</text>

      <rect x="300" y="0" width="155" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
      <text x="377" y="21" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">SEMTECH SX1262</text>
    </g>
  </g>

  <!-- Right Visual: Stylized LoRa RF Spectrum & Node Diagram -->
  <g transform="translate(680, 80)">
    <!-- Base Card -->
    <rect x="0" y="0" width="440" height="470" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Decorative Top Wave Header -->
    <rect x="25" y="25" width="390" height="150" rx="16" fill="#0b1120" stroke="#1e293b"/>
    <text x="45" y="52" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">CHIRP SPREAD SPECTRUM (CSS)</text>

    <!-- Synthetic Upchirp Spectrogram in Card -->
    <path d="M 45 145 L 120 70" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 125 145 L 200 70" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 205 145 L 245 105" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 145 L 320 75" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 325 145 L 395 70" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <!-- CSS Axis Annotation -->
    <line x1="45" y1="155" x2="395" y2="155" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="168" fill="#64748b" font-size="10" font-family="monospace">t = 0</text>
    <text x="395" y="168" fill="#64748b" font-size="10" font-family="monospace" text-anchor="end">t = 2^SF / BW</text>

    <!-- System Architecture Icons / Pipeline inside Card -->
    <!-- Node -->
    <g transform="translate(35, 210)">
      <rect x="0" y="0" width="105" height="95" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="52" cy="35" r="14" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="52" y="40" fill="#22d3ee" font-size="14" text-anchor="middle">📡</text>
      <text x="52" y="66" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">End Node</text>
      <text x="52" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">SX1262 Radio</text>
    </g>

    <!-- Wireless Arrow 1 -->
    <path d="M 148 257 L 172 257" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="172,253 180,257 172,261" fill="#06b6d4"/>
    <text x="160" y="248" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">Sub-GHz</text>

    <!-- Gateway -->
    <g transform="translate(185, 210)">
      <rect x="0" y="0" width="105" height="95" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="52" cy="35" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="52" y="40" fill="#34d399" font-size="14" text-anchor="middle">🗼</text>
      <text x="52" y="66" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Gateway</text>
      <text x="52" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">SX1302 Concentrator</text>
    </g>

    <!-- IP Backhaul Arrow 2 -->
    <path d="M 298 257 L 322 257" stroke="#10b981" stroke-width="2"/>
    <polygon points="322,253 330,257 322,261" fill="#10b981"/>
    <text x="310" y="248" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">IP/LTE</text>

    <!-- Cloud Server -->
    <g transform="translate(335, 210)">
      <rect x="0" y="0" width="70" height="95" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="35" y="40" fill="#c084fc" font-size="14" text-anchor="middle">☁️</text>
      <text x="35" y="66" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Server</text>
      <text x="35" y="80" fill="#94a3b8" font-size="8" text-anchor="middle">ChirpStack</text>
    </g>

    <!-- Feature Tags Bottom Grid -->
    <g transform="translate(25, 335)">
      <rect x="0" y="0" width="390" height="110" rx="14" fill="#0b1120" stroke="#1e293b"/>
      <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="700">⚡ CÁC ĐẶC TÍNH KỸ THUẬT VƯỢT TRỘI</text>
      
      <circle cx="28" cy="54" r="3" fill="#10b981"/>
      <text x="38" y="58" fill="#e2e8f0" font-size="12">Cự ly kết nối: <tspan fill="#34d399" font-weight="700">3 - 15+ km</tspan> (Link Budget > 150 dB)</text>

      <circle cx="28" cy="76" r="3" fill="#10b981"/>
      <text x="38" y="80" fill="#e2e8f0" font-size="12">Thời lượng pin: <tspan fill="#34d399" font-weight="700">5 - 10 năm</tspan> với Class A Deep Sleep</text>

      <circle cx="28" cy="98" r="3" fill="#10b981"/>
      <text x="38" y="102" fill="#e2e8f0" font-size="12">Bảo mật kép: <tspan fill="#38bdf8" font-weight="700">AES-128 (NwkSKey &amp; AppSKey)</tspan></text>
    </g>
  </g>

  <!-- Bottom Lab Footer -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="30" fill="#64748b" font-size="13" font-weight="600">embedded-aiot.com/tutorials/lora-lorawan</text>
    <text x="1040" y="30" fill="#64748b" font-size="13" font-weight="600" text-anchor="end">Khoa Điện Tử 1 — Học Viện Công Nghệ Bưu Chính Viễn Thông</text>
  </g>
</svg>

