<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="upchirpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="downchirpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="dataChirpGrad1" x1="0%" y1="50%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dataChirpGrad2" x1="50%" y1="100%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="15" y="15" width="930" height="590" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Diagram Title Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800">NGUYÊN LÝ ĐIỀU CHẾ CHIRP SPREAD SPECTRUM (CSS) TRONG LORA</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">Phân tích giản đồ Tần số - Thời gian (Spectrogram) &amp; Dạng sóng vô tuyến của Khung Preamble và Dữ liệu</text>
  </g>

  <!-- Section 1: Spectrogram (Frequency vs Time) -->
  <g transform="translate(50, 105)">
    <!-- Container Box -->
    <rect x="0" y="0" width="860" height="260" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Spectrogram Grid Lines -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3">
      <line x1="80" y1="40" x2="820" y2="40"/>
      <line x1="80" y1="90" x2="820" y2="90"/>
      <line x1="80" y1="140" x2="820" y2="140"/>
      <line x1="80" y1="190" x2="820" y2="190"/>
      <line x1="260" y1="30" x2="260" y2="210"/>
      <line x1="440" y1="30" x2="440" y2="210"/>
      <line x1="620" y1="30" x2="620" y2="210"/>
      <line x1="800" y1="30" x2="800" y2="210"/>
    </g>

    <!-- Y-Axis (Frequency) -->
    <line x1="80" y1="210" x2="80" y2="30" stroke="#64748b" stroke-width="2"/>
    <polygon points="76,32 80,24 84,32" fill="#64748b"/>
    <text x="70" y="44" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="end">f_max (f0 + BW/2)</text>
    <text x="70" y="125" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="700" text-anchor="end">f0 (Center Freq)</text>
    <text x="70" y="205" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="end">f_min (f0 - BW/2)</text>
    <text x="35" y="115" fill="#94a3b8" font-size="12" font-weight="700" transform="rotate(-90 35 115)" text-anchor="middle">TẦN SỐ (MHz)</text>

    <!-- X-Axis (Time) -->
    <line x1="80" y1="210" x2="830" y2="210" stroke="#64748b" stroke-width="2"/>
    <polygon points="828,206 836,210 828,214" fill="#64748b"/>
    <text x="825" y="235" fill="#94a3b8" font-size="11" font-weight="700">THỜI GIAN (t)</text>

    <!-- Time Annotations for Symbols -->
    <text x="170" y="228" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">Ts = 2^SF / BW</text>
    <text x="350" y="228" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">Ts (Preamble)</text>
    <text x="530" y="228" fill="#f87171" font-size="11" font-family="monospace" text-anchor="middle">Sync (Down-chirp)</text>
    <text x="710" y="228" fill="#34d399" font-size="11" font-family="monospace" text-anchor="middle">Ts (Symbol Dữ liệu)</text>

    <!-- 1. Raw Upchirp (Unmodulated Chirp in Preamble) -->
    <g>
      <line x1="90" y1="200" x2="250" y2="40" stroke="url(#upchirpGrad)" stroke-width="4" stroke-linecap="round"/>
      <rect x="110" y="55" width="120" height="24" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="170" y="71" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Up-chirp (Preamble)</text>
    </g>

    <!-- 2. Second Upchirp -->
    <g>
      <line x1="270" y1="200" x2="430" y2="40" stroke="url(#upchirpGrad)" stroke-width="4" stroke-linecap="round"/>
      <text x="350" y="90" fill="#64748b" font-size="10" text-anchor="middle">Đồng bộ máy thu</text>
    </g>

    <!-- 3. Downchirp (Sync Word Frame / Inverted Chirp) -->
    <g>
      <line x1="450" y1="40" x2="610" y2="200" stroke="url(#downchirpGrad)" stroke-width="4" stroke-linecap="round"/>
      <rect x="470" y="55" width="120" height="24" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#ef4444" stroke-width="0.8"/>
      <text x="530" y="71" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">Down-chirp (Sync)</text>
    </g>

    <!-- 4. Modulated Data Chirp (Cyclic Shift by Symbol Value S) -->
    <g>
      <!-- Part 1: from fold point to f_max -->
      <line x1="630" y1="120" x2="710" y2="40" stroke="url(#dataChirpGrad1)" stroke-width="4" stroke-linecap="round"/>
      <!-- Cyclic wrap-around (jump from f_max to f_min) -->
      <line x1="710" y1="40" x2="710" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Part 2: from f_min to fold point -->
      <line x1="710" y1="200" x2="790" y2="120" stroke="url(#dataChirpGrad2)" stroke-width="4" stroke-linecap="round"/>

      <rect x="650" y="150" width="130" height="38" rx="5" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1"/>
      <text x="715" y="166" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Dịch Tần Số (Cyclic)</text>
      <text x="715" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">Mã hóa Symbol: S = 2^k</text>
    </g>
  </g>

  <!-- Section 2: Time-Domain Waveform Illustration -->
  <g transform="translate(50, 390)">
    <!-- Container Box -->
    <rect x="0" y="0" width="860" height="175" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="28" fill="#38bdf8" font-size="12" font-weight="700">DẠNG SÓNG MIỀN THỜI GIAN (TIME-DOMAIN RF WAVEFORM)</text>
    <text x="835" y="28" fill="#64748b" font-size="11" text-anchor="end">Biên độ không đổi (Constant Envelope) — Tiết kiệm năng lượng PA</text>

    <!-- Synthetic Frequency-Increasing Sine Waveform -->
    <!-- Low freq start -> high freq end -->
    <path d="M 50 100 
             Q 70 50, 90 100 T 130 100 
             Q 145 60, 160 100 T 190 100 
             Q 202 60, 215 100 T 240 100
             Q 250 65, 260 100 T 280 100
             Q 288 65, 296 100 T 312 100
             Q 318 68, 325 100 T 338 100
             Q 343 68, 349 100 T 360 100
             Q 365 70, 370 100 T 380 100
             Q 385 70, 389 100 T 398 100
             Q 402 70, 406 100 T 414 100
             Q 418 70, 421 100 T 428 100" 
          fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Downchirp waveform: High freq -> Low freq -->
    <path d="M 450 100 
             Q 454 70, 457 100 T 464 100
             Q 468 70, 472 100 T 480 100
             Q 485 70, 490 100 T 500 100
             Q 506 68, 512 100 T 524 100
             Q 531 68, 538 100 T 552 100
             Q 560 65, 570 100 T 590 100
             Q 602 65, 615 100 T 640 100
             Q 655 60, 670 100 T 700 100
             Q 720 50, 740 100 T 780 100
             Q 805 50, 830 100" 
          fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Annotations under waveforms -->
    <text x="240" y="152" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="600">
      Up-chirp: Tần số tăng dần (Chu kỳ T giảm dần)
    </text>
    <text x="640" y="152" fill="#f87171" font-size="11" text-anchor="middle" font-weight="600">
      Down-chirp: Tần số giảm dần (Chu kỳ T tăng dần)
    </text>
    <line x1="435" y1="45" x2="435" y2="160" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Bottom Brand Footer -->
  <text x="50" y="590" fill="#475569" font-size="11">Embedded-AIoT Lab — Minh họa kỹ thuật chuẩn độc quyền bài 01</text>
  <text x="910" y="590" fill="#475569" font-size="11" text-anchor="end">Nguồn chuẩn: Semtech AN1200.22 LoRa Modulation Basics</text>
</svg>

