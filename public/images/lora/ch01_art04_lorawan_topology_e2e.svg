<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="nodeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="15" y="15" width="950" height="590" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800">KIẾN TRÚC MẠNG TOÀN TRÌNH END-TO-END CỦA HỆ THỐNG LORAWAN</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">Mô hình hình sao kép (Star-of-Stars Topology): Thiết bị đầu cuối, Trạm thu Gateway, Máy chủ mạng và Ứng dụng</text>
  </g>

  <!-- Stage 1: End Devices (Nodes) -->
  <g transform="translate(45, 110)">
    <rect x="0" y="0" width="160" height="340" rx="12" fill="#090d16" stroke="#059669" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="80" y="30" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">END DEVICES</text>
    <text x="80" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Thiết Bị Đầu Cuối</text>

    <!-- Node 1: Smart Agriculture -->
    <g transform="translate(15, 65)">
      <rect x="0" y="0" width="130" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="24" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">🌾 Nông Nghiệp</text>
      <text x="65" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">Đo ẩm đất, NPK</text>
      <text x="65" y="58" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">SX1262 | Pin LiSOCl2</text>
    </g>

    <!-- Node 2: Smart Meter -->
    <g transform="translate(15, 150)">
      <rect x="0" y="0" width="130" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="24" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">⚡ Công Tơ Điện</text>
      <text x="65" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">Đo điện áp, chỉ số kWh</text>
      <text x="65" y="58" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Class C (Nguồn lưới)</text>
    </g>

    <!-- Node 3: Asset Tracker -->
    <g transform="translate(15, 235)">
      <rect x="0" y="0" width="130" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="24" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">📍 Định Vị GPS</text>
      <text x="65" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">Theo dõi container hàng</text>
      <text x="65" y="58" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Class A | Cảm biến rung</text>
    </g>
  </g>

  <!-- Wireless Link Annotations -->
  <g transform="translate(205, 110)">
    <!-- Wireless Wave 1 to Gateway 1 -->
    <path d="M 10 100 Q 40 80, 70 85" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Wireless Wave 2 to Gateway 2 -->
    <path d="M 10 185 Q 40 160, 70 120" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 10 185 Q 40 210, 70 240" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Wireless Wave 3 to Gateway 2 -->
    <path d="M 10 270 Q 40 260, 70 265" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>

    <text x="40" y="40" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">SÓNG RF</text>
    <text x="40" y="54" fill="#94a3b8" font-size="9" text-anchor="middle">LoRa CSS</text>
    <text x="40" y="66" fill="#94a3b8" font-size="9" text-anchor="middle">920-923 MHz</text>
  </g>

  <!-- Stage 2: Gateways (Concentrators) -->
  <g transform="translate(285, 110)">
    <rect x="0" y="0" width="140" height="340" rx="12" fill="#090d16" stroke="#0284c7" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="70" y="30" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">GATEWAYS</text>
    <text x="70" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Trạm Thu Tập Trung</text>

    <!-- Gateway 1 -->
    <g transform="translate(15, 65)">
      <rect x="0" y="0" width="110" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="55" y="24" fill="#38bdf8" font-size="14" text-anchor="middle">🗼</text>
      <text x="55" y="44" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Outdoor GW</text>
      <text x="55" y="62" fill="#94a3b8" font-size="9" text-anchor="middle">SX1302 8 kênh</text>
      <text x="55" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">Anten 5.8 dBi</text>
      <rect x="15" y="85" width="80" height="1" fill="#334155"/>
    </g>

    <!-- Gateway 2 -->
    <g transform="translate(15, 205)">
      <rect x="0" y="0" width="110" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="55" y="24" fill="#38bdf8" font-size="14" text-anchor="middle">🏢</text>
      <text x="55" y="44" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Indoor GW</text>
      <text x="55" y="62" fill="#94a3b8" font-size="9" text-anchor="middle">SX1303 (Fine TS)</text>
      <text x="55" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">Packet Forwarder</text>
    </g>
  </g>

  <!-- IP Backhaul Arrows -->
  <g transform="translate(425, 110)">
    <line x1="10" y1="115" x2="60" y2="150" stroke="#10b981" stroke-width="2"/>
    <line x1="10" y1="255" x2="60" y2="190" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="195" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">TCP/IP</text>
    <text x="35" y="208" fill="#94a3b8" font-size="8" text-anchor="middle">4G / Eth</text>
  </g>

  <!-- Stage 3: Network Server & Join Server (Core) -->
  <g transform="translate(495, 110)">
    <rect x="0" y="0" width="220" height="340" rx="12" fill="#090d16" stroke="#7c3aed" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="110" y="30" fill="#c084fc" font-size="12" font-weight="800" text-anchor="middle">NETWORK SERVER (LNS)</text>
    <text x="110" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">ChirpStack v4 / TTS v3</text>

    <!-- LNS Functions Box -->
    <g transform="translate(15, 65)">
      <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#4c1d95"/>
      <text x="15" y="24" fill="#e9d5ff" font-size="11" font-weight="700">Các chức năng cốt lõi:</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="10">1. Lọc trùng gói tin (Deduplication)</text>
      <text x="15" y="66" fill="#cbd5e1" font-size="10">2. Kiểm tra tính toàn vẹn MIC</text>
      <text x="15" y="86" fill="#cbd5e1" font-size="10">3. Thuật toán thích ứng ADR</text>
      <text x="15" y="106" fill="#cbd5e1" font-size="10">4. Lên lịch Downlink (RX1/RX2)</text>
      <text x="15" y="126" fill="#38bdf8" font-size="10" font-weight="600">5. Quản lý Frame Counter (FCnt)</text>
    </g>

    <!-- Join Server Sub-box -->
    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="190" height="85" rx="8" fill="#1e293b" stroke="#7c3aed"/>
      <text x="15" y="22" fill="#f43f5e" font-size="11" font-weight="700">🔑 JOIN SERVER (OTAA)</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="9">Lưu trữ khóa gốc bí mật AppKey</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="9">Sinh khóa phiên AppSKey &amp; NwkSKey</text>
      <text x="15" y="74" fill="#34d399" font-size="9" font-weight="600">Bảo mật chuẩn AES-128</text>
    </g>
  </g>

  <!-- Connect to Application Layer -->
  <g transform="translate(715, 110)">
    <line x1="5" y1="170" x2="35" y2="170" stroke="#c084fc" stroke-width="2"/>
    <text x="20" y="162" fill="#c084fc" font-size="9" text-anchor="middle">MQTT</text>
  </g>

  <!-- Stage 4: Application Server & User Dashboard -->
  <g transform="translate(755, 110)">
    <rect x="0" y="0" width="170" height="340" rx="12" fill="#090d16" stroke="#db2777" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="85" y="30" fill="#f472b6" font-size="12" font-weight="800" text-anchor="middle">APP &amp; CLOUD</text>
    <text x="85" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Giải Mã &amp; Giám Sát</text>

    <!-- App Server Box -->
    <g transform="translate(15, 65)">
      <rect x="0" y="0" width="140" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="22" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">Application Server</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="9">• Giải mã bằng AppSKey</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="9">• Payload Codec (JSON)</text>
      <text x="15" y="80" fill="#cbd5e1" font-size="9">• Forward MQTT Broker</text>
      <text x="15" y="98" fill="#34d399" font-size="9">• Webhook HTTP</text>
    </g>

    <!-- Dashboard Box -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="140" height="120" rx="8" fill="#1e293b" stroke="#db2777"/>
      <text x="70" y="24" fill="#fb7185" font-size="14" text-anchor="middle">📊</text>
      <text x="70" y="44" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Web Dashboard</text>
      <text x="15" y="66" fill="#cbd5e1" font-size="9">Grafana / InfluxDB</text>
      <text x="15" y="84" fill="#cbd5e1" font-size="9">ThingsBoard IoT</text>
      <text x="15" y="104" fill="#38bdf8" font-size="9" font-weight="600">Cảnh báo Telegram/SMS</text>
    </g>
  </g>

  <!-- Bottom Security Layer Pipeline -->
  <g transform="translate(45, 470)">
    <rect x="0" y="0" width="880" height="80" rx="10" fill="#090d16" stroke="url(#secGrad)" stroke-width="1.5"/>
    <text x="25" y="26" fill="#38bdf8" font-size="12" font-weight="800">🛡️ CƠ CHẾ BẢO MẬT PHÂN LỚP ĐỘC LẬP (DUAL AES-128 ENCRYPTION):</text>
    
    <g transform="translate(25, 40)">
      <text x="0" y="16" fill="#e2e8f0" font-size="11">
        • <tspan fill="#60a5fa" font-weight="700">Tầng Mạng (Network Layer):</tspan> Mã hóa toàn vẹn tin nhắn bằng <tspan fill="#38bdf8" font-family="monospace">NwkSKey</tspan> — Gateway chỉ chuyển tiếp mà không thể đọc nội dung.
      </text>
      <text x="0" y="32" fill="#e2e8f0" font-size="11">
        • <tspan fill="#34d399" font-weight="700">Tầng Ứng Dụng (Application Layer):</tspan> Dữ liệu được mã hóa đầu cuối bằng <tspan fill="#10b981" font-family="monospace">AppSKey</tspan> — Ngay cả Network Server cũng không giải mã được Payload.
      </text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="585" fill="#475569" font-size="11">Embedded-AIoT Lab — Bài 04: Kiến trúc hệ thống toàn trình End-to-End LoRaWAN</text>
</svg>

