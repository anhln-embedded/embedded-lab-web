<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="15" y="15" width="930" height="590" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800">MA TRẬN ĐÁNH GIÁ CÔNG NGHỆ KHÔNG DÂY: LORAWAN VỚI CÁC CHUẨN IOT</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">So sánh trực quan giữa LoRaWAN, NB-IoT, LTE-M, Wi-Fi, BLE và Zigbee trên 5 tiêu chí kỹ thuật cốt lõi</text>
  </g>

  <!-- Left: 2D Tradeoff Chart (Data Rate vs Range) -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="460" height="440" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="25" y="32" fill="#38bdf8" font-size="13" font-weight="700">TƯƠNG QUAN BĂNG THÔNG VS CỰ LY KẾT NỐI</text>

    <!-- Axes -->
    <!-- Y: Data Rate (Log scale) -->
    <line x1="60" y1="390" x2="60" y2="60" stroke="#64748b" stroke-width="2"/>
    <polygon points="56,62 60,54 64,62" fill="#64748b"/>
    <text x="50" y="75" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">> 100 Mbps</text>
    <text x="50" y="175" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">1 Mbps</text>
    <text x="50" y="275" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">100 kbps</text>
    <text x="50" y="375" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">&lt; 1 kbps</text>
    <text x="20" y="210" fill="#94a3b8" font-size="11" font-weight="700" transform="rotate(-90 20 210)" text-anchor="middle">TỐC ĐỘ DỮ LIỆU</text>

    <!-- X: Range (Log scale) -->
    <line x1="60" y1="390" x2="430" y2="390" stroke="#64748b" stroke-width="2"/>
    <polygon points="428,386 436,390 428,394" fill="#64748b"/>
    <text x="80" y="410" fill="#94a3b8" font-size="10" font-family="monospace">1 - 10m</text>
    <text x="180" y="410" fill="#94a3b8" font-size="10" font-family="monospace">100m</text>
    <text x="290" y="410" fill="#94a3b8" font-size="10" font-family="monospace">1 km</text>
    <text x="390" y="410" fill="#94a3b8" font-size="10" font-family="monospace">15+ km</text>
    <text x="240" y="428" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">CỰ LY TRUYỀN DẪN (TẦM PHỦ SÓNG)</text>

    <!-- Regions -->
    <!-- 1. Wi-Fi (High Speed, Short Range) -->
    <ellipse cx="120" cy="100" rx="45" ry="30" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="98" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">Wi-Fi (802.11)</text>
    <text x="120" y="112" fill="#cbd5e1" font-size="9" text-anchor="middle">Streaming, Video</text>

    <!-- 2. BLE / Zigbee (Short Range, Medium-Low Data) -->
    <ellipse cx="110" cy="220" rx="40" ry="40" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="110" y="215" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">BLE / Zigbee</text>
    <text x="110" y="230" fill="#cbd5e1" font-size="9" text-anchor="middle">Smart Home, Wearable</text>

    <!-- 3. Cellular LTE-M (High Range, Medium Data) -->
    <ellipse cx="320" cy="180" rx="55" ry="35" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="320" y="176" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">LTE-M (eMTC)</text>
    <text x="320" y="192" fill="#cbd5e1" font-size="9" text-anchor="middle">Voice, Tracking cao cấp</text>

    <!-- 4. Cellular NB-IoT (High Range, Low Data, Telco Licensed) -->
    <ellipse cx="340" cy="280" rx="55" ry="35" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="340" y="276" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">NB-IoT</text>
    <text x="340" y="292" fill="#cbd5e1" font-size="9" text-anchor="middle">Mạng nhà mạng (SIM card)</text>

    <!-- 5. LoRaWAN (SWEET SPOT: Ultra Long Range, Lowest Power, Sub-GHz ISM) -->
    <ellipse cx="370" cy="350" rx="55" ry="32" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2.5"/>
    <text x="370" y="346" fill="#6ee7b7" font-size="12" font-weight="800" text-anchor="middle">LoRa / LoRaWAN</text>
    <text x="370" y="362" fill="#f8fafc" font-size="9" font-weight="600" text-anchor="middle">Pin 10 năm, Cự ly 15km</text>
  </g>

  <!-- Right: Comparison Table Breakdown -->
  <g transform="translate(530, 105)">
    <rect x="0" y="0" width="380" height="440" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="25" y="32" fill="#38bdf8" font-size="13" font-weight="700">BẢNG PHÂN TÍCH QUYẾT ĐỊNH THIẾT KẾ</text>

    <g transform="translate(20, 50)">
      <!-- Row 1: LoRaWAN -->
      <rect x="0" y="0" width="340" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#34d399" font-size="12" font-weight="800">LoRaWAN (Lựa chọn tối ưu LPWAN)</text>
      <text x="15" y="40" fill="#e2e8f0" font-size="10">Phổ tần: ISM Miễn cấp phép | Chi phí SIM: 0đ</text>
      <text x="15" y="54" fill="#94a3b8" font-size="10">Triển khai trạm riêng (Private Network) hoàn toàn tự chủ.</text>

      <!-- Row 2: NB-IoT -->
      <rect x="0" y="75" width="340" height="65" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="15" y="97" fill="#22d3ee" font-size="12" font-weight="700">NB-IoT (Cellular IoT)</text>
      <text x="15" y="115" fill="#e2e8f0" font-size="10">Phổ tần: Được cấp phép (Licensed LTE bands)</text>
      <text x="15" y="129" fill="#94a3b8" font-size="10">Phụ thuộc sóng nhà mạng viễn thông, phải trả cước SIM.</text>

      <!-- Row 3: BLE 5.0 -->
      <rect x="0" y="150" width="340" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="15" y="172" fill="#c084fc" font-size="12" font-weight="700">Bluetooth Low Energy (BLE 5.x)</text>
      <text x="15" y="190" fill="#e2e8f0" font-size="10">Phổ tần: 2.4 GHz ISM | Cự ly: &lt; 50 mét</text>
      <text x="15" y="204" fill="#94a3b8" font-size="10">Tối ưu cho giao tiếp khoảng cách ngắn (Personal Area Network).</text>

      <!-- Row 4: Wi-Fi -->
      <rect x="0" y="225" width="340" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="247" fill="#60a5fa" font-size="12" font-weight="700">Wi-Fi (802.11 b/g/n/ax)</text>
      <text x="15" y="265" fill="#e2e8f0" font-size="10">Băng thông: Rất cao (&gt; 10 Mbps) | Cự ly: &lt; 100 mét</text>
      <text x="15" y="279" fill="#94a3b8" font-size="10">Tiêu thụ dòng điện lớn (80 - 300 mA), không chạy được pin lâu.</text>

      <!-- Summary Recommendation -->
      <rect x="0" y="300" width="340" height="75" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
      <text x="15" y="322" fill="#facc15" font-size="11" font-weight="700">💡 Khuyến nghị Thiết kế Phần cứng:</text>
      <text x="15" y="340" fill="#cbd5e1" font-size="10">Dự án cảm biến ngoài trời, nông nghiệp, công tơ, pin</text>
      <text x="15" y="356" fill="#34d399" font-size="10" font-weight="700">5-10 năm không thay pin $\to$ Chọn LoRaWAN</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="585" fill="#475569" font-size="11">Embedded-AIoT Lab — Bài 03: So sánh chi tiết các công nghệ mạng IoT không dây</text>
</svg>

