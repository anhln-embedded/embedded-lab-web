<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #f8fafc;
        --canvas-border: #e2e8f0;
        --title: #0f172a;
        --subtitle: #475569;
        
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --inner-well: #f1f5f9;
        --inner-well-border: #e2e8f0;
        
        --step-num: #0284c7;
        --step-title: #0f172a;
        --step-desc: #334155;
        --step-muted: #64748b;
        --code-font: #0369a1;
        
        --card-warn-border: #f59e0b;
        --card-warn-well-bg: #fffbeb;
        --card-warn-well-border: #fde68a;
        --card-warn-code: #b45309;
        
        --card-pass-bg: #f0fdf4;
        --card-pass-border: #16a34a;
        --card-pass-num: #15803d;
        --card-pass-well-border: #86efac;
        
        --arrow-color: #0284c7;
      }

      

      .canvas-bg { fill: var(--canvas-bg); stroke: var(--canvas-border); stroke-width: 1.5; }
      .step-card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.5; rx: 10px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: var(--title); text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--subtitle); text-anchor: middle; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: var(--step-num); }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: var(--step-title); }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--step-desc); }
      .code-font { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: var(--code-font); }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--arrow-color)" />
    </marker>
  </defs>

  <rect width="1000" height="480" class="canvas-bg" rx="16" />

  <text x="500" y="38" class="title">QUY TRÌNH KIỂM CHUẨN MÃ BĂM SHA-256 &amp; NẠP HỆ ĐIỀU HÀNH AOSP</text>
  <text x="500" y="62" class="subtitle">Xác Minh Toàn Vẹn Bản ROM, Ghi Thẻ MicroSD Và Kích Hoạt Cầu Nối Gỡ Lỗi ADB Không Dây</text>

  <!-- STEP 1: DOWNLOAD -->
  <g transform="translate(30, 85)">
    <rect width="210" height="230" class="step-card" />
    <text x="15" y="25" class="step-num">BƯỚC 01</text>
    <text x="15" y="45" class="step-title">Tải Tệp Tin Ảnh ROM</text>
    <text x="15" y="65" class="step-desc">• Bản build: KonstaKANG</text>
    <text x="15" y="82" class="step-desc">  AOSP 17 (30/10/2026)</text>
    <text x="15" y="99" class="step-desc">• Thiết bị: Raspberry Pi 4</text>

    <rect x="12" y="115" width="186" height="100" rx="6" fill="var(--inner-well)" stroke="var(--inner-well-border)" stroke-width="1" />
    <text x="20" y="135" class="step-desc" fill="var(--step-muted)">Nguồn tải chính thức:</text>
    <text x="20" y="152" class="code-font">konstakang.com</text>
    <text x="20" y="172" class="step-desc" fill="var(--step-muted)">Kích thước file zip:</text>
    <text x="20" y="190" class="step-desc" font-weight="bold" fill="var(--step-title)">~1.2 GB (Compressed)</text>
  </g>

  <line x1="240" y1="200" x2="275" y2="200" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- STEP 2: SHA256 VERIFY -->
  <g transform="translate(280, 85)">
    <rect width="240" height="230" class="step-card" stroke="var(--card-warn-border)" />
    <text x="15" y="25" class="step-num" fill="#f59e0b">BƯỚC 02</text>
    <text x="15" y="45" class="step-title">Tính Toán Mã Băm SHA256</text>
    
    <rect x="12" y="60" width="216" height="75" rx="6" fill="var(--card-warn-well-bg)" stroke="var(--card-warn-well-border)" stroke-width="1" />
    <text x="20" y="80" class="code-font" font-size="9.5">sha256sum AOSP17-*.zip</text>
    <text x="20" y="100" class="step-desc" fill="var(--card-warn-code)">Mã chuẩn: 9c02408206...</text>
    <text x="20" y="120" class="step-desc" fill="var(--card-warn-code)">cfa522f52a945c5f87deb709</text>

    <text x="15" y="155" class="step-desc" font-weight="bold">Kiểm tra kết quả so sánh:</text>
    
    <rect x="12" y="165" width="100" height="50" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="22" y="185" class="code-font" fill="#b91c1c">Sai lệch ❌</text>
    <text x="22" y="202" font-size="9" fill="#b91c1c" font-weight="bold">HỦY BỎ NGAY</text>

    <rect x="125" y="165" width="103" height="50" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="135" y="185" class="code-font" fill="#15803d">Khớp 100% ✓</text>
    <text x="135" y="202" font-size="9" fill="#15803d" font-weight="bold">TIẾP TỤC GHI</text>
  </g>

  <line x1="520" y1="200" x2="555" y2="200" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- STEP 3: FLASH -->
  <g transform="translate(560, 85)">
    <rect width="210" height="230" class="step-card" />
    <text x="15" y="25" class="step-num">BƯỚC 03</text>
    <text x="15" y="45" class="step-title">Ghi Thẻ Nhớ MicroSD</text>
    <text x="15" y="65" class="step-desc">• Raspberry Pi Imager</text>
    <text x="15" y="82" class="step-desc">• Thẻ Class 10 U3 A2</text>
    <text x="15" y="99" class="step-desc">• Dung lượng: ≥ 16 GB</text>

    <rect x="12" y="115" width="186" height="100" rx="6" fill="var(--inner-well)" stroke="var(--inner-well-border)" stroke-width="1" />
    <text x="20" y="135" class="step-desc" fill="var(--step-muted)">Tiến trình ghi dữ liệu:</text>
    <text x="20" y="155" class="step-desc" font-weight="bold" fill="#0284c7">Writing 100%</text>
    <text x="20" y="175" class="step-desc" font-weight="bold" fill="#16a34a">Verifying 100%</text>
    <text x="20" y="195" class="step-desc" fill="var(--step-desc)">Eject thẻ an toàn</text>
  </g>

  <line x1="770" y1="200" x2="805" y2="200" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- STEP 4: FIRST BOOT & ADB -->
  <g transform="translate(810, 85)">
    <rect width="160" height="230" rx="10" fill="var(--card-pass-bg)" stroke="var(--card-pass-border)" stroke-width="2" />
    <text x="15" y="25" class="step-num" fill="var(--card-pass-num)">BƯỚC 04</text>
    <text x="15" y="45" class="step-title">Boot &amp; Bật ADB</text>
    <text x="15" y="65" class="step-desc">• Cấp nguồn RPi4</text>
    <text x="15" y="82" class="step-desc">• Mở Developer</text>
    <text x="15" y="99" class="step-desc">• Bật Network ADB</text>

    <rect x="10" y="115" width="140" height="100" rx="6" fill="var(--inner-well)" stroke="var(--card-pass-well-border)" stroke-width="1" />
    <text x="18" y="135" class="step-desc" fill="var(--card-pass-num)" font-weight="bold">Lệnh kết nối Host:</text>
    <text x="18" y="155" class="code-font" font-size="9.5">adb connect</text>
    <text x="18" y="172" class="code-font" font-size="9.5">&lt;IP_BOARD&gt;:5555</text>
    <text x="18" y="195" class="code-font" fill="#16a34a" font-weight="bold">device (READY)</text>
  </g>

  <!-- LOWER PANEL: SUMMARY CHECKLIST -->
  <g transform="translate(30, 335)">
    <rect width="940" height="120" class="step-card" stroke="#3b82f6" />
    <text x="20" y="28" class="step-title" fill="#1d4ed8">TỔNG KẾT NGUYÊN TẮC AN TOÀN TRƯỚC KHI THỰC HIỆN BSP AUDIT:</text>
    <text x="20" y="55" class="step-desc">1. Tuyệt đối không giải nén bằng phần mềm lỗi làm méo dạng file `.img` nguyên gốc.</text>
    <text x="20" y="75" class="step-desc">2. Sử dụng nguồn Type-C chuẩn 5V / 3A chính hãng để tránh hiện tượng sụt áp (Undervoltage warning) gây treo nhân Linux giữa chừng.</text>
    <text x="20" y="95" class="step-desc">3. Giữ cố định địa chỉ IP tĩnh (Static DHCP) cho Raspberry Pi 4 trên router để phiên gỡ lỗi ADB không bị ngắt kết nối.</text>
  </g>
</svg>