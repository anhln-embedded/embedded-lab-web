<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">

    <style>
      :root {
        --canvas-bg: #ffffff;
        --canvas-border: #e2e8f0;
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --title-color: #0f172a;
        --subtitle-color: #475569;
        --text-primary: #1e293b;
        --text-muted: #64748b;
        --accent-blue: #0284c7;
        --accent-green: #10b981;
        --accent-amber: #f59e0b;
        --accent-red: #ef4444;
        --accent-purple: #8b5cf6;
        --wire-line: #94a3b8;
        --bus-line: #3b82f6;
      }
      
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>

  <rect width="940" height="440" rx="14" fill="var(--canvas-bg)" stroke="var(--canvas-border)" stroke-width="2"/>
  <text x="470" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--title-color)">CÁC CƠ CHẾ ĐỒNG BỘ NÂNG CAO TRONG FREERTOS</text>
  <text x="470" y="62" text-anchor="middle" font-size="13" fill="var(--subtitle-color)">Event Groups (Đồng bộ đa sự kiện 24-bit) và Task Notifications (Zero-RAM Overhead)</text>

  <!-- Left: Event Groups -->
  <g transform="translate(40, 95)">
    <rect width="415" height="315" rx="10" fill="var(--card-bg)" stroke="var(--accent-purple)" stroke-width="2"/>
    <text x="207" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent-purple)">1. EVENT GROUPS (24-BIT BITMASK)</text>
    
    <rect x="20" y="55" width="375" height="40" rx="6" fill="var(--canvas-bg)" stroke="var(--card-border)"/>
    <text x="35" y="80" font-size="12" fill="var(--text-primary)">Bit 0: Cảm biến sẵn sàng (xEventGroupSetBits)</text>

    <rect x="20" y="105" width="375" height="40" rx="6" fill="var(--canvas-bg)" stroke="var(--card-border)"/>
    <text x="35" y="130" font-size="12" fill="var(--text-primary)">Bit 1: Bộ nhớ Flash sẵn sàng</text>

    <rect x="20" y="155" width="375" height="40" rx="6" fill="var(--canvas-bg)" stroke="var(--card-border)"/>
    <text x="35" y="180" font-size="12" fill="var(--text-primary)">Bit 2: Người dùng nhấn phím START</text>

    <rect x="20" y="210" width="375" height="55" rx="6" fill="var(--accent-purple)" fill-opacity="0.15" stroke="var(--accent-purple)" stroke-width="1.5"/>
    <text x="207" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-purple)">xEventGroupWaitBits(..., pdTRUE, pdTRUE, ...)</text>
    <text x="207" y="252" text-anchor="middle" font-size="11" fill="var(--text-muted)">Logic AND: Chỉ thức dậy khi TẤT CẢ các cờ đều bật</text>

    <text x="207" y="295" text-anchor="middle" font-size="11" fill="var(--text-muted)">Hỗ trợ cả chế độ Logic OR (Bất kỳ cờ nào)</text>
  </g>

  <!-- Right: Task Notifications -->
  <g transform="translate(485, 95)">
    <rect width="415" height="315" rx="10" fill="var(--card-bg)" stroke="var(--accent-green)" stroke-width="2"/>
    <text x="207" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent-green)">2. TASK NOTIFICATIONS (ZERO-RAM)</text>

    <rect x="20" y="55" width="375" height="60" rx="6" fill="var(--canvas-bg)" stroke="var(--card-border)"/>
    <text x="35" y="80" font-size="12" font-weight="700" fill="var(--text-primary)">Task Control Block (TCB) của Task Nhận</text>
    <text x="35" y="100" font-size="11" fill="var(--accent-amber)">Tích hợp sẵn trường uint32_t ulNotifiedValue</text>

    <rect x="20" y="125" width="375" height="55" rx="6" fill="var(--canvas-bg)" stroke="var(--accent-blue)" stroke-width="1.5"/>
    <text x="35" y="148" font-size="12" font-weight="700" fill="var(--accent-blue)">Task Gửi hoặc Ngắt ISR:</text>
    <text x="35" y="167" font-size="11" fill="var(--text-primary)">xTaskNotifyGive() / vTaskNotifyGiveFromISR()</text>

    <rect x="20" y="190" width="375" height="55" rx="6" fill="var(--canvas-bg)" stroke="var(--accent-green)" stroke-width="1.5"/>
    <text x="35" y="213" font-size="12" font-weight="700" fill="var(--accent-green)">Task Nhận giải phóng ngay:</text>
    <text x="35" y="232" font-size="11" fill="var(--text-primary)">ulTaskNotifyTake(pdTRUE, portMAX_DELAY)</text>

    <rect x="20" y="255" width="375" height="45" rx="6" fill="var(--canvas-bg)" stroke="var(--card-border)"/>
    <text x="207" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-green)">Nhanh hơn 45% so với Semaphore &amp; 0 Byte RAM phụ!</text>
  </g>
</svg>